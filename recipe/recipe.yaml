schema_version: 1

context:
  version: "1.1.3"

package:
  name: r-varnish
  version: ${{ version }}

source:
  url: https://github.com/carpentries/varnish/archive/refs/tags/${{ version }}.tar.gz
  sha256: 9818800aad78c2f4c8f0c67ca1042499efa086adfdf24d3a571f9f4c5970da86

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
  run:
    - r-base

tests:
  - r:
      libraries:
        - varnish

about:
  license: MIT
  summary: The Carpentries Lesson HTML Templates
  description: |
    This project does not contain any useful R code.
    It contains HTML templates with mustache syntax, CSS, and JavaScript.
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - LICENSE
  homepage: https://github.com/carpentries/varnish
  repository: https://github.com/carpentries/varnish
  documentation: https://carpentries.github.io/varnish/

extra:
  recipe-maintainers:
    - conda-forge/r
    - matthewfeickert
